# Render Blueprint — ONE service running both the API and the web app.
#
# How to use:
#   1. Push this repo to GitHub.
#   2. Render dashboard → New → Blueprint → pick this repo.
#   3. Fill in the values marked `sync: false` in the service's Environment tab.
#
# Inside the instance:
#   public  $PORT            -> Next.js (apps/web)          via scripts/start-all.sh
#   loopback 127.0.0.1:4000  -> NestJS  (apps/api)
#
# Why one service: Render's free/cheap tiers bill per service, and a single
# service avoids CORS and a second public URL entirely. See DEPLOYMENT.md §2b
# for the two-service alternative if you prefer stronger isolation.

services:
  - type: web
    name: al-wassouf
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: .
    buildCommand: npm ci --include=dev && npm run build:shared && npm run build -w @wassouf/api && npm run build -w @wassouf/web
    startCommand: bash scripts/start-all.sh
    healthCheckPath: /
    # Persistent storage for uploaded product images.
    # Disks require a paid instance type (starter+); drop this block on free tier.
    disk:
      name: wassouf-media
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: MEDIA_DIR
        value: /var/data/uploads
      # Fixed internal URL — the web proxies to the in-instance API.
      # No manual step needed, unlike the two-service setup.
      - key: API_BASE_URL
        value: http://127.0.0.1:4000
      # Set this to the public URL Render assigns (or your custom domain),
      # then redeploy so it is baked into the build.
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DEFAULT_WHATSAPP_COUNTRY_CODE
        value: "963"
      - key: BR_01_WHATSAPP_LOCAL
        sync: false
      - key: BR_01_WHATSAPP_COUNTRY_CODE
        sync: false
      - key: BR_02_WHATSAPP_LOCAL
        sync: false
      - key: BR_02_WHATSAPP_COUNTRY_CODE
        sync: false
